services:
  postgres:
    image: postgres:16
    container_name: brewlite-postgres-compose
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brewlite_db
    ports:
      - "5433:5432"
    volumes:
      - brewlite-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewlite_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brewlite-postgres-data: