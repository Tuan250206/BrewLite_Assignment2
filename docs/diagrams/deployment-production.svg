<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1320" viewBox="0 0 2040 1320" role="img" aria-labelledby="title description">
  <title id="title">BrewLite production deployment diagram on Render</title>
  <desc id="description">Local development, GitHub Actions and GHCR delivery, and Render production services for the BrewLite Next.js, NestJS and PostgreSQL system.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #000000; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 14px; }
      .section { font-size: 18px; font-weight: 700; }
      .box-title { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; }
      .boundary { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 9 6; }
      .node { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
      .flow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .async { fill: none; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 7 5; marker-end: url(#arrow-dashed); }
      .flow-label {
        font-size: 11px;
        paint-order: stroke;
        stroke: #FFFFFF;
        stroke-width: 5px;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <rect width="2040" height="1320" fill="#FFFFFF"/>
  <text x="1020" y="42" text-anchor="middle" class="title">BrewLite - Production Architecture (Render)</text>
  <text x="1020" y="67" text-anchor="middle" class="subtitle">Next.js frontend + NestJS API + managed PostgreSQL</text>

  <rect x="28" y="90" width="330" height="1150" fill="#FFFFFF" class="boundary"/>
  <text x="48" y="122" class="section">Local Development</text>

  <rect x="48" y="145" width="290" height="110" class="node"/>
  <text x="193" y="171" text-anchor="middle" class="box-title">Developer workstation</text>
  <text x="193" y="196" text-anchor="middle" class="body">Git working tree</text>
  <text x="193" y="217" text-anchor="middle" class="small">frontend/ · backend/</text>
  <text x="193" y="238" text-anchor="middle" class="small">Node.js / package scripts</text>

  <rect x="48" y="298" width="290" height="92" class="node"/>
  <text x="193" y="326" text-anchor="middle" class="box-title">Next.js app / browser client</text>
  <text x="193" y="350" text-anchor="middle" class="body">localhost:3000</text>
  <text x="193" y="372" text-anchor="middle" class="small">Web UI</text>

  <rect x="48" y="446" width="290" height="92" class="node"/>
  <text x="193" y="474" text-anchor="middle" class="box-title">NestJS API</text>
  <text x="193" y="498" text-anchor="middle" class="body">localhost:3001</text>
  <text x="193" y="520" text-anchor="middle" class="small">Local HTTP API</text>

  <rect x="48" y="594" width="290" height="104" class="node"/>
  <text x="193" y="623" text-anchor="middle" class="box-title">Local PostgreSQL</text>
  <text x="193" y="648" text-anchor="middle" class="body">localhost:5432</text>
  <text x="193" y="675" text-anchor="middle" class="small">Docker volume: postgres_data</text>

  <rect x="48" y="757" width="290" height="113" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="193" y="786" text-anchor="middle" class="box-title">Local configuration</text>
  <text x="193" y="812" text-anchor="middle" class="body">frontend/.env.local</text>
  <text x="193" y="837" text-anchor="middle" class="small">backend/.env · ignored by Git</text>
  <text x="193" y="857" text-anchor="middle" class="small">Never commit secret values.</text>

  <path d="M193 255 L193 296" class="flow"/>
  <path d="M193 390 L193 444" class="flow"/>
  <text x="204" y="421" class="flow-label">NEXT_PUBLIC_API_URL · HTTP :3001</text>
  <path d="M193 538 L193 592" class="flow"/>
  <text x="204" y="570" class="flow-label">Docker Compose · TCP :5432</text>
  <path d="M338 200 L370 200 L370 340 L338 340" class="async"/>
  <path d="M338 214 L380 214 L380 488 L338 488" class="async"/>
  <text x="282" y="281" class="flow-label">run source</text>

  <rect x="422" y="90" width="470" height="1150" fill="#FFFFFF" class="boundary"/>
  <text x="442" y="122" class="section">CI / Container Delivery</text>

  <rect x="447" y="150" width="420" height="212" class="node"/>
  <text x="657" y="178" text-anchor="middle" class="box-title">GitHub repository + Actions runner</text>
  <text x="657" y="207" text-anchor="middle" class="body">Push / merge triggers CI</text>
  <rect x="478" y="226" width="358" height="106" fill="#FFFFFF" stroke="#000000"/>
  <text x="657" y="251" text-anchor="middle" class="body">Run checks and tests</text>
  <text x="657" y="276" text-anchor="middle" class="body">Build frontend and backend container images</text>
  <text x="657" y="301" text-anchor="middle" class="body">Tag images with commit SHA</text>
  <text x="657" y="322" text-anchor="middle" class="small">Publish only after required checks pass</text>

  <rect x="470" y="434" width="380" height="150" class="node"/>
  <text x="660" y="464" text-anchor="middle" class="box-title">GitHub Container Registry (GHCR)</text>
  <rect x="495" y="483" width="155" height="75" fill="#FFFFFF" stroke="#000000"/>
  <text x="572" y="512" text-anchor="middle" class="body">BrewLite frontend</text>
  <text x="572" y="535" text-anchor="middle" class="small">Docker image</text>
  <rect x="670" y="483" width="155" height="75" fill="#FFFFFF" stroke="#000000"/>
  <text x="747" y="512" text-anchor="middle" class="body">BrewLite backend</text>
  <text x="747" y="535" text-anchor="middle" class="small">Docker image</text>

  <rect x="470" y="644" width="380" height="133" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="660" y="674" text-anchor="middle" class="box-title">Planned GitHub Actions secrets</text>
  <text x="660" y="704" text-anchor="middle" class="body">Registry credentials (if private)</text>
  <text x="660" y="730" text-anchor="middle" class="body">RENDER_DEPLOY_HOOK_URL</text>
  <text x="660" y="756" text-anchor="middle" class="small">Secret values are never placed in the image</text>

  <rect x="470" y="830" width="380" height="112" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="660" y="860" text-anchor="middle" class="box-title">Delivery sequence</text>
  <text x="660" y="887" text-anchor="middle" class="body">Tests → publish images → trigger deploy</text>
  <text x="660" y="915" text-anchor="middle" class="small">Render pulls configured images from GHCR</text>

  <path d="M657 362 L657 432" class="flow"/>
  <text x="668" y="405" class="flow-label">HTTPS :443, push images</text>
  <path d="M850 510 L910 510 L910 525 L1480 525 L1480 420 L1530 420" class="flow"/>
  <text x="900" y="493" text-anchor="end" class="flow-label">pull frontend image</text>
  <path d="M850 550 L950 550 L1490 550 L1490 665 L1530 665" class="flow"/>
  <text x="900" y="533" text-anchor="end" class="flow-label">pull backend image</text>
  <path d="M867 340 L910 340 L910 1170 L1030 1170" class="async"/>
  <text x="800" y="1158" text-anchor="middle" class="flow-label">HTTPS deploy hook (secret)</text>

  <rect x="1030" y="90" width="980" height="155" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1050" y="120" class="section">User Device</text>
  <rect x="1230" y="143" width="580" height="78" class="node"/>
  <text x="1520" y="172" text-anchor="middle" class="box-title">Customer browser</text>
  <text x="1520" y="199" text-anchor="middle" class="body">Accesses public HTTPS endpoints on port 443</text>

  <rect x="1030" y="270" width="980" height="970" fill="#FFFFFF" class="boundary"/>
  <text x="1050" y="302" class="section">Production (Render)</text>

  <rect x="1060" y="345" width="250" height="150" class="node"/>
  <text x="1185" y="377" text-anchor="middle" class="box-title">Render edge / TLS</text>
  <text x="1185" y="405" text-anchor="middle" class="body">HTTPS termination</text>
  <text x="1185" y="432" text-anchor="middle" class="small">Public routes :443</text>
  <text x="1185" y="456" text-anchor="middle" class="small">Managed certificates</text>
  <text x="1185" y="480" text-anchor="middle" class="small">Routes users to frontend and API</text>

  <rect x="1530" y="345" width="380" height="150" class="node"/>
  <text x="1720" y="377" text-anchor="middle" class="box-title">Next.js Web Service</text>
  <text x="1720" y="405" text-anchor="middle" class="body">Public HTTPS :443 · accessible to users</text>
  <text x="1720" y="432" text-anchor="middle" class="small">Render HTTP service port :10000</text>
  <text x="1720" y="465" text-anchor="middle" class="small">SSR / web assets · source: frontend/</text>

  <rect x="1530" y="590" width="380" height="200" class="node"/>
  <text x="1720" y="622" text-anchor="middle" class="box-title">NestJS API Web Service</text>
  <text x="1720" y="652" text-anchor="middle" class="body">Public HTTPS API for browser requests</text>
  <text x="1720" y="681" text-anchor="middle" class="small">Private-only needs a Next.js BFF/proxy</text>
  <text x="1720" y="710" text-anchor="middle" class="small">Render :10000; code currently binds :3001</text>
  <text x="1720" y="739" text-anchor="middle" class="body">GET /health not implemented</text>
  <text x="1720" y="768" text-anchor="middle" class="small">Mock payment: backend/src/payments</text>

  <rect x="1060" y="590" width="250" height="200" class="node"/>
  <text x="1185" y="622" text-anchor="middle" class="box-title">Managed PostgreSQL</text>
  <text x="1185" y="652" text-anchor="middle" class="body">Private network · TCP :5432</text>
  <text x="1185" y="681" text-anchor="middle" class="small">Internal database URL</text>
  <text x="1185" y="710" text-anchor="middle" class="small">No public route</text>
  <text x="1185" y="768" text-anchor="middle" class="small">Only backend connects</text>

  <rect x="1060" y="840" width="250" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="1185" y="875" text-anchor="middle" class="box-title">Persistent Database Storage</text>
  <text x="1185" y="907" text-anchor="middle" class="small">Managed with Render PostgreSQL</text>
  <text x="1185" y="937" text-anchor="middle" class="small">Configure backup retention</text>

  <rect x="1530" y="850" width="380" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="1720" y="884" text-anchor="middle" class="box-title">Backend Environment</text>
  <text x="1720" y="916" text-anchor="middle" class="small">DATABASE_URL · JWT_SECRET</text>
  <text x="1720" y="946" text-anchor="middle" class="small">MOCK_GATEWAY_WEBHOOK_SECRET</text>
  <text x="1720" y="976" text-anchor="middle" class="small">PAYMENT_WEBHOOK_URL</text>

  <rect x="1060" y="1000" width="250" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="1185" y="1035" text-anchor="middle" class="box-title">Frontend Environment</text>
  <text x="1185" y="1067" text-anchor="middle" class="small">NEXT_PUBLIC_API_URL</text>
  <text x="1185" y="1097" text-anchor="middle" class="small">Set at build time</text>

  <rect x="1530" y="1060" width="380" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="1720" y="1095" text-anchor="middle" class="box-title">Render Logs and Monitoring</text>
  <text x="1720" y="1125" text-anchor="middle" class="small">Application stdout / stderr</text>
  <text x="1720" y="1155" text-anchor="middle" class="small">Deploy logs and health checks</text>
  <text x="1720" y="1185" text-anchor="middle" class="small">Health endpoint must be implemented</text>

  <path d="M1520 221 L1520 325 L1185 325 L1185 343" class="flow"/>
  <text x="1330" y="316" text-anchor="middle" class="flow-label">HTTPS :443</text>
  <path d="M1310 410 L1530 410" class="flow"/>
  <text x="1420" y="398" text-anchor="middle" class="flow-label">HTTP :10000</text>
  <path d="M1310 470 L1480 470 L1480 665 L1530 665" class="flow"/>
  <text x="1390" y="555" text-anchor="middle" class="flow-label">HTTP :10000</text>
  <path d="M1530 780 L1310 780" class="flow"/>
  <text x="1420" y="763" text-anchor="middle" class="flow-label">private TCP :5432</text>
  <path d="M1185 790 L1185 838" class="flow"/>
  <path d="M1720 850 L1720 792" class="async"/>
  <path d="M1910 900 L1930 900 L1930 680 L1912 680" class="async"/>
  <path d="M1310 1060 L1350 1060 L1350 510 L1490 510 L1490 460 L1520 460" class="async"/>
  <text x="1390" y="530" class="flow-label">build-time config</text>
  <path d="M1910 450 L1930 450 L1930 1125 L1912 1125" class="async"/>
  <path d="M1910 700 L1940 700 L1940 1155 L1912 1155" class="async"/>
  <text x="1720" y="1225" text-anchor="middle" class="flow-label">stdout / stderr</text>
  <rect x="28" y="1260" width="1984" height="1" fill="#000000"/>
  <text x="1020" y="1285" text-anchor="middle" class="small">Architecture target: Render, CI, registry and containers are not configured yet; API port change and GET /health remain required.</text>
</svg>
